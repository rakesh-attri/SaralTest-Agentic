[project]
name = "qa-eval"
version = "0.1.0"
description = "DeepEval sidecar for sf-qa-agent (PLAN.md section 9). Judge model wiring now; runner, metrics and gates in Phase 8."
requires-python = ">=3.12"
dependencies = [
  "deepeval>=3.0",
  "openai>=1.40",
  "pydantic>=2.7",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
