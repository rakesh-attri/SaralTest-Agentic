# Operator case edits for SF-219 (applied by: qa build --case-edits examples/case-edits/SF-219.yaml).
# "Phone Inquiry" is not a Lead Source value in qa-prod. The phone-format cases only need a Lead Source that is not
# Web (so Phone_Required_For_Web does not fire); "Word of mouth" is an active qa-prod value (snapshot 2026-11-25).
storyKey: SF-219
decidedBy: QA operator
decidedOn: '2026-11-26'
# Cases whose steps are a review of another manual test's execution record: not automatable. No spec; the RTM
# automation view lists them as manual.
manualOnly:
  - caseId: TC-SF-219-051
    reason: reviews the execution record of manual test MTC-005 — a human check, not automatable
  - caseId: TC-SF-219-052
    reason: reviews the execution record of manual test MTC-004 — a human check, not automatable
edits:
  - caseId: TC-SF-219-007
    step: 2
    from: "set Lead Source to 'Phone Inquiry'"
    to: "set Lead Source to any non-Web value (e.g. 'Word of mouth')"
    reason: Phone Inquiry is not a qa-prod Lead Source; any non-Web value is valid
  - caseId: TC-SF-219-009
    step: 2
    from: "set Lead Source to 'Phone Inquiry'"
    to: "set Lead Source to any non-Web value (e.g. 'Word of mouth')"
    reason: Phone Inquiry is not a qa-prod Lead Source; any non-Web value is valid
  - caseId: TC-SF-219-010
    step: 2
    from: "set Lead Source to 'Phone Inquiry'"
    to: "set Lead Source to any non-Web value (e.g. 'Word of mouth')"
    reason: Phone Inquiry is not a qa-prod Lead Source; any non-Web value is valid
  - caseId: TC-SF-219-010
    step: 5
    from: "set Lead Source to 'Phone Inquiry'"
    to: "set Lead Source to any non-Web value (e.g. 'Word of mouth')"
    reason: Phone Inquiry is not a qa-prod Lead Source; any non-Web value is valid
  # TC-050 (operator 2026-11-26, pass-2 judge findings of review2-20261126-221229-0ad9). The duplicate warning observed
  # on qa-prod (om-run-p5-observe-8-5, accepted) has no Save button of its own — only "View Duplicates"; step 2 of the
  # case already expects the dialog's Save button to stay enabled. Saving again is done in the New Contact dialog.
  - caseId: TC-SF-219-050
    step: 3
    from: Click Save on the duplicate warning dialog to confirm saving the duplicate Contact
    to: Click Save in the New Contact dialog again to save the duplicate Contact (the duplicate warning has no Save button of its own)
    reason: the observed qa-prod warning (om-run-p5-observe-8-5) only offers View Duplicates; the dialog's Save stays enabled (step 2)
  - caseId: TC-SF-219-050
    step: 3
    field: expected
    from: and the Contact detail page opens showing the entered
    to: and its record, opened from the Account's Contacts related list, shows the entered
    reason: operator rule 2026-11-26 — the Contact page opening after Save is not a requirement (Save stays on the Account)
  - caseId: TC-SF-219-050
    step: 4
    from: Verify via SOQL that the duplicate Contact was saved on the Account with Email 'duplicate@test.com'
    to: Verify via SOQL that the duplicate Contact was saved on the Account with Email 'duplicate@test.com', and that the pre-existing Contact is still on that Account
    reason: the expected result checks both Contacts by SOQL ("alongside the pre-existing Contact"); the action now says so
# Steps that review another (manual) test's execution record: not automatable inside an automated case.
dropSteps:
  - caseId: TC-SF-219-050
    step: 5
    reason: confirms manual test MTC-009 passed (its RE_VERIFY status) — a human check of an execution record, like TC-051/052

# ---- Phase 7 (operator decision 2026-11-27, Phase 7 plan): BR-08 — a Contact with open Cases cannot be deleted.
# BR-08 is intentionally NOT implemented in qa-prod (decision Q3): TC-031 is expected to fail and becomes the real-defect
# demo (investigate → Defect Judge → JIRA bug draft shown to the operator before anything is posted).
# RF-004 (judge, pass 1) asked for the positive counterpart: TC-SF-219-054 below (revised 2026-11-28: a Contact without any Case).
decisions:
  - id: P7-BR08-POS
    text: >-
      Positive counterpart of BR-08 (operator 2026-11-27, revised 2026-11-28): a Contact without any Case can be
      deleted; deleting it succeeds and the Contact no longer exists. Any associated Case, open or closed, blocks the
      delete — a Salesforce platform rule observed on qa-prod (run-p7-live-br08-1: "could not be completed because it is
      associated with the following cases").
dataRecipe:
  - caseId: TC-SF-219-031
    recipe: contact-open-case
    reason: the precondition needs a Contact with an open Case (Account → Contact → Case Status New)
  - caseId: TC-SF-219-054
    recipe: account-contact
    reason: the positive counterpart needs a Contact without any Case (operator 2026-11-28, platform rule)
approve:
  - caseId: TC-SF-219-031
    findingIds: [RF-004]
    resolution: the positive counterpart TC-SF-219-054 is added (operator decision P7-BR08-POS); all expectations are APPROVED_REQUIREMENT
addCases:
  - id: TC-SF-219-054
    title: Contact without any Case can be deleted
    requirementIds: [SF-219-R22]
    riskIds: [RISK-11]
    technique: equivalence partitioning (complement of TC-SF-219-031)
    persona: system-admin
    type: functional
    priority: P1
    severity: MAJOR
    preconditions:
      - A Contact exists that has no Case
      - User is logged in as System Administrator
    steps:
      - action: Navigate to the Contact record page, click Delete and confirm the deletion in the dialog
        expected:
          text: The Contact is deleted
          evidenceLevel: APPROVED_REQUIREMENT
          evidenceIds: [SF-219-CASE-EDITS#P7-BR08-POS]
      - action: Verify via SOQL that the Contact no longer exists
        expected:
          text: No Contact with that record Id is found
          evidenceLevel: APPROVED_REQUIREMENT
          evidenceIds: [SF-219-CASE-EDITS#P7-BR08-POS]
    tags: ['@functional', '@P1', '@SF-219', '@persona:system-admin', '@mandatory']
    reviewStatus: APPROVED
    snapshotId: snap-00DdN00000uQ5dK-20261125122127-93cc
    refs: [BR-08]
    regressionTier: mandatory
