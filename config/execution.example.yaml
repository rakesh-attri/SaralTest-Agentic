browser: chromium          # chromium (Playwright bundled, CI default) | chrome (local install) | msedge (fallback)
fallbackBrowser: msedge
headless: true
viewports:
  - { name: desktop, width: 1440, height: 900 }
  - { name: laptop,  width: 1280, height: 720 }
  - { name: tablet,  width: 1024, height: 768 }
visual:
  maxDiffPixelRatio: 0.01
  mask: [dates, recordIds, spinners, userNames, pii]
  allowExternalUpload: false   # screenshots never sent to an external model unless true for the run
  viewports: [desktop, tablet] # visual suite: desktop + one smaller viewport (functional tests: viewports[0] only)
  baselineDir: tests/visual-baselines   # <baselineDir>/<org>/<region>-<persona>-<viewport>.png + baselines.json
  regionRatio: {}              # per-region maxDiffPixelRatio overrides (always shown in the visual-diff report)
  layoutShiftThreshold: 0.1    # cumulative layout shift above this is a layout finding
testIdAttribute: data-testid   # custom LWCs only; standard Lightning components are located by role/label
a11y:
  customNamespaces: [c]        # violations inside these LWC namespaces fail @a11y tests
  # violations whose target only holds these Salesforce-owned namespaces are recorded as known baseline findings
  standardNamespaces: [lightning, force, records, one, forcegenerated, runtime_, flexipage, slds]
